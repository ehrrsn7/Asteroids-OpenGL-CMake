name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        # Removed libglfw3-dev to prevent target name collisions with FetchContent
        sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }}

    - name: Copy Assets for Artifact
      run: |
        mkdir -p ${{ steps.strings.outputs.build-output-dir }}/Release
        mkdir -p ${{ steps.strings.outputs.build-output-dir }}/Debug
        cp -r assets ${{ steps.strings.outputs.build-output-dir }}/Release/ || true
        cp -r assets ${{ steps.strings.outputs.build-output-dir }}/Debug/ || true
        cp -r assets ${{ steps.strings.outputs.build-output-dir }}/ || true

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: asteroids-binary-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.c_compiler }}
        path: |
          ${{ steps.strings.outputs.build-output-dir }}/Asteroids.exe
          ${{ steps.strings.outputs.build-output-dir }}/Asteroids
          ${{ steps.strings.outputs.build-output-dir }}/Release/Asteroids.exe
          ${{ steps.strings.outputs.build-output-dir }}/Debug/Asteroids.exe